<text x="650" y="244" text-anchor="start" class="tsig" font-size="11">BUZ (PB11)</text>
<text x="20" y="395" text-anchor="start" class="ref" font-size="11">Courants à 4,2 V (texte de DES-011) :</text>
<text x="20" y="411" text-anchor="start" font-size="11">rouge (4,2 − 2,0) / 120 = 18,3 mA ; vert et bleu (4,2 − 3,0) / 68 = 17,6 mA, avec les tensions directes supposées (2,0 V ; 3,0 V).</text>
<text x="20" y="425" text-anchor="start" font-size="11">avec celles du catalogue (2,4 V ; 3,4 V) : 15 mA et 11,8 mA ; blanc : au plus 61 mA (minima de la fiche), 54 mA (valeurs supposées).</text>
<text x="20" y="439" text-anchor="start" font-size="11">buzzer : environ 30 mA, fréquence propre 2,7 kHz, un seul timbre ; courant total le plus défavorable : 61 mA + 30 mA = 91 mA.</text>
<text x="20" y="453" text-anchor="start" font-size="11">MOSFET Q5 à Q8 : AO3400A (SOT-23). Diode D5 : SS34, cathode côté VBATM (roue libre du buzzer).</text>
<text x="20" y="466" text-anchor="start" font-size="11">Voyant SZYY1615RGB-B (fiche p. 2) : broche 4 anode (VBATM), 1 rouge, 2 vert, 3 bleu.</text>
<text x="20" y="493" text-anchor="start" font-size="11">Rouge : 37 mW pour 40 mW permis, courant admis réduit vers 45 à 50 °C (fiche p. 3 et 5) : marge faible acceptée (DEC-282).</text>
<text x="20" y="479" text-anchor="start" class="twarn" font-size="11">Orange : tensions directes du vert et du bleu (3,0 V supposé, 3,4 V au catalogue) : faibles sous 3,7 V de batterie si 3,4 V.</text>
<line x1="14" y1="560" x2="886" y2="560" class="thin" style="opacity:.4"/>
<text x="20" y="576" style="font-size:11px">Couleurs : rouge = VBATM / VBATL ; bleu = +3V0 ; violet = +2V0 ; vert = signaux ; noir = masse et liaisons ; orange = à vérifier.</text>
<text x="20" y="590" style="font-size:11px">Texte de référence : DES-011 « Circuit du voyant RGB et du buzzer ». Repères (LED1, BZ1, Q5 à Q8, R9 à R19, D5) provisoires.</text>
<text x="20" y="604" style="font-size:11px">À vérifier (orange) : DOU-161 « Tensions directes du voyant RGB : visibilité du vert et du bleu entre 3,4 et 3,7 V » ; DOU-183 « Repères de composants</text>
<text x="20" y="618" style="font-size:11px">   provisoires des schémas SVG de la conception détaillée ».</text>
<text x="20" y="632" style="font-size:11px">Illustration de conception, pas le schéma KiCad de fabrication (DEC-275 « Schémas SVG des circuits de la carte dans la conception détaillée »).</text>
</svg>