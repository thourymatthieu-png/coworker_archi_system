<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 648" width="900" height="648" role="img" aria-labelledby="t d"><title id="t">DES-011 — Circuit du voyant RGB et du buzzer</title><desc id="d">Voyant RGB à anode commune sur VBATM, trois AO3400A avec résistances de limitation de 120, 68 et 68 ohms ; buzzer actif et diode SS34 sur un quatrième AO3400A.</desc><style>
