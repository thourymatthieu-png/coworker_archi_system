<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 647" width="900" height="647" role="img" aria-labelledby="t d"><title id="t">DES-007 — Circuit de puissance d'un moteur (voie 1 ; identique pour les 4 voies)</title><desc id="d">Schéma de principe : AO3400A côté bas, résistance de grille 47 ohms, rappel 100 kohms, diode SS34 en roue libre, 100 nF aux bornes du moteur, condensateurs de la ligne VBATM.</desc><style>
