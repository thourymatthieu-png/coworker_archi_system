<text x="20" y="513" text-anchor="start" class="twarn" font-size="11">PA11 en AF11 : confirmé dans DS12589 (tableau 13). Orange : résistance à 3,0 V et Ciss maximal non trouvés (DOU-199).</text>
<line x1="14" y1="545" x2="886" y2="545" class="thin" style="opacity:.4"/>
<text x="20" y="561" style="font-size:11px">Couleurs : rouge = VBATM / VBATL ; bleu = +3V0 ; violet = +2V0 ; vert = signaux ; noir = masse et liaisons ; orange = à vérifier.</text>
<text x="20" y="575" style="font-size:11px">Le circuit est identique pour M1 à M4 : seuls changent la broche, le réseau (M1_G à M4_G) et les repères (tableau). Texte de référence : DES-007 «</text>
<text x="20" y="589" style="font-size:11px">   Circuit de puissance des moteurs ».</text>
<text x="20" y="603" style="font-size:11px">Repères (R1, Q1, D1, C1…) provisoires : le texte du DES n'en donne pas. À vérifier (orange) : DOU-199 « AO3400A : résistance à 3,0 V et capacité d'entrée maximale non</text>
<text x="20" y="617" style="font-size:11px">   trouvées dans la fiche » ; DOU-183 « Repères de composants provisoires des schémas SVG de la conception détaillée ».</text>
<text x="20" y="631" style="font-size:11px">Illustration de conception, pas le schéma KiCad de fabrication (DEC-275 « Schémas SVG des circuits de la carte dans la conception détaillée »).</text>
