<text x="520" y="300" text-anchor="start" class="ref" font-size="11">Contrôles (texte de DES-007) :</text>
<text x="520" y="316" text-anchor="start" font-size="11">τ = 100 kΩ × Ciss : 69 µs (630 pF), 138 µs (1260 pF)</text>
<text x="520" y="331" text-anchor="start" font-size="11">commutation 47 Ω × 630 pF = 30 ns</text>
<text x="520" y="346" text-anchor="start" font-size="11">conduction 2,4 A : 0,14 W (24 mΩ), 0,28 W (48 mΩ)</text>
<text x="520" y="361" text-anchor="start" font-size="11">grille en 3,0 V (24 / 48 mΩ à 2,5 V, fiche)</text>
