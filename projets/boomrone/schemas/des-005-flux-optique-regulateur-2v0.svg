<text x="20" y="412" text-anchor="start" font-size="11">Six plots de repli (1,5 × 1,5 mm, pas de 2,54 mm, bord de carte) : +3V0, masse, SCK, MOSI, MISO, CS, pistes de moins de 5 mm.</text>
<text x="20" y="437" text-anchor="start" font-size="11">Bilan : charge 9 mA, pointe de 70 mA à la montée ; chute minimale du régulateur 0,55 à 0,78 V (70 à 100 mA) ; marge 1,0 V (rail à 3,0 V) ou 0,9 V (2,9 V).</text>
<text x="20" y="451" text-anchor="start" font-size="11">Sortie 1,96 à 2,04 V si la tolérance est de 2 % ; limite de la puce 1,8 à 2,1 V ; dissipation moyenne 9 mW, 70 mW à la pointe.</text>
<text x="20" y="465" text-anchor="start" font-size="11">SPI2 mode 3, diviseur 128 : 1,328125 MHz ; VDDIO au moins égale à VDD, respecté dès le démarrage.</text>
<text x="20" y="479" text-anchor="start" font-size="11">Lentille LN03-ZSZ collée à la main sur la puce (DOU-164).</text>
<text x="20" y="497" text-anchor="start" class="twarn" font-size="11">Orange : C15 à C18 (« empreintes 0603 prévues », valeurs finales à relever sur la figure 8 de la fiche), numéros de broches du régulateur de mémoire.</text>
<line x1="14" y1="530" x2="886" y2="530" class="thin" style="opacity:.4"/>
<text x="20" y="546" style="font-size:11px">Couleurs : rouge = VBATM / VBATL ; bleu = +3V0 ; violet = +2V0 ; vert = signaux ; noir = masse et liaisons ; orange = à vérifier.</text>
<text x="20" y="560" style="font-size:11px">Texte de référence : DES-005 « Raccordement du flux optique PMW3901MB et régulateur de 2,0 V ». Régulateur : 1 µF (C13) en entrée, 2,2 µF (C14) en</text>
<text x="20" y="574" style="font-size:11px">   sortie.</text>
<text x="20" y="588" style="font-size:11px">Repères (U6, C13 à C18, R22, R23) provisoires ; noms de broches de la puce de mémoire. À vérifier (orange) : DOU-165 « Flux optique : alimentation en</text>
<text x="20" y="602" style="font-size:11px">   2,0 V, valeurs de fiche et mise sous tension » ; DOU-164 « PMW3901MB : lentille, assemblage par JLCPCB et refusion de la puce » ; DOU-182 « Noms et</text>
<text x="20" y="616" style="font-size:11px">   numéros de broches des circuits intégrés des schémas SVG non relevés dans les fiches » ; DOU-183 « Repères de composants provisoires des schémas</text>
<text x="20" y="630" style="font-size:11px">   SVG de la conception détaillée ».</text>
<text x="20" y="644" style="font-size:11px">Illustration de conception, pas le schéma KiCad de fabrication (DEC-275 « Schémas SVG des circuits de la carte dans la conception détaillée »).</text>
