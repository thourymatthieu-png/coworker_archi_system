<polyline class="w" points="551,366 569,366"/>
<polyline class="w" points="554,370 566,370"/>
<polyline class="w" points="557,374 563,374"/>
<text x="570" y="356" text-anchor="start" font-size="11">GND (3, 4, 6, 12), AVSSVCSEL (2)</text>
<text x="20" y="395" text-anchor="start" font-size="11">I2C1 400 kHz, adresse 0x29 ; temps de montée = 0,8473 × 4,7 kΩ × C : 119 ns avec 30 pF, sous les 300 ns exigés tant que C &lt; 75 pF.</text>
<text x="20" y="409" text-anchor="start" font-size="11">XSHUT : rappel de 10 kΩ, le capteur est actif dès la mise sous tension. Le rail +3V0 descend à environ 2,9 V (minimum du composant : 2,6 V, fiche DS12385 p. 18).</text>
<text x="20" y="423" text-anchor="start" font-size="11">Fenêtre optique dégagée, cône de 27°, capteur à 20 mm du plan de contact (DES-006) : hauteur = lecture brute − 20 mm ;</text>
<text x="20" y="437" text-anchor="start" font-size="11">coupure à 25 mm de hauteur = lecture brute de 45 mm.</text>
<text x="486" y="294" text-anchor="start" font-size="11">DNC (8) : flottante</text>
<text x="20" y="465" text-anchor="start" class="twarn" font-size="11">Orange : mode 2V8 des E/S à régler dans l'ULD (DOU-149). C22, C23 : figure 3 p. 6 de la fiche DS12385 ; C24 : ajout du projet. Aucune broche IOVDD.</text>
<line x1="14" y1="500" x2="886" y2="500" class="thin" style="opacity:.4"/>
<text x="20" y="516" style="font-size:11px">Couleurs : rouge = VBATM / VBATL ; bleu = +3V0 ; violet = +2V0 ; vert = signaux ; noir = masse et liaisons ; orange = à vérifier.</text>
<text x="20" y="530" style="font-size:11px">Texte de référence : DES-004 « Raccordement du capteur de hauteur VL53L1X ». Croisement de fils sans point = pas de liaison (les rappels montent vers</text>
<text x="20" y="544" style="font-size:11px">   +3V0). Noms et numéros des broches relevés dans la fiche DS12385 Rev 8 (figures 2 et 3 p. 5 et 6).</text>
<text x="20" y="558" style="font-size:11px">Repères (R25 à R28, C22 à C24) provisoires. À vérifier (orange) : DOU-149 « Valeurs de registres du VL53L1X à vérifier dans la bibliothèque ST (ULD) » ;</text>
<text x="20" y="572" style="font-size:11px">   DOU-157 « VL53L1CX contre VL53L1X : identifiant, bibliothèque et registres » ; DOU-183 « Repères de composants provisoires des schémas SVG de la</text>
<text x="20" y="586" style="font-size:11px">   conception détaillée ».</text>
<text x="20" y="600" style="font-size:11px">Illustration de conception, pas le schéma KiCad de fabrication (DEC-275 « Schémas SVG des circuits de la carte dans la conception détaillée »).</text>
</svg>