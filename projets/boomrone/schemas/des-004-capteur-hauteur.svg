.l2{stroke:#a855f7;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.warn{stroke:#d97706;stroke-width:1.8;fill:none;stroke-dasharray:6 3}
.sig{stroke:#059669;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.fill{fill:var(--fg);stroke:none}
