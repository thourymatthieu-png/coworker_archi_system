<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 616" width="900" height="616" role="img" aria-labelledby="t d"><title id="t">DES-004 — Raccordement du capteur de hauteur VL53L1X</title><desc id="d">VL53L1CXV0FY/1 sur I2C1 (PA15, PB7) avec rappels de 4,7 kohms, GPIO1 vers PB6, XSHUT vers PB9, alimentations au +3V0 avec découplages.</desc><style>
