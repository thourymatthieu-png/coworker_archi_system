.tbat{fill:#ef4444;font-weight:bold}.tl3{fill:#3b82f6;font-weight:bold}.tl2{fill:#a855f7;font-weight:bold}
.tsig{fill:#059669}.twarn{fill:#d97706;font-weight:bold}
.ref{font-weight:bold}.small{font-size:11px}.title{font-size:16px;font-weight:bold}
.val{opacity:.9}
</style>
