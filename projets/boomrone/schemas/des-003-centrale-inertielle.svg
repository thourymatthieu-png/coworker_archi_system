<polyline class="w" points="720,110 720,137.0"/>
<polyline class="w" points="720,143.0 720,170"/>
<polyline class="w" points="710,137.0 730,137.0"/>
<polyline class="w" points="710,143.0 730,143.0"/>
<text x="720" y="197" text-anchor="middle" class="ref " font-size="11">C20</text>
<text x="720" y="209" text-anchor="middle" class="val" font-size="11">100 nF</text>
<polyline class="w" points="720,170 720,176"/>
<polyline class="w" points="711,176 729,176"/>
<polyline class="w" points="714,180 726,180"/>
<polyline class="w" points="717,184 723,184"/>
<polyline class="w" points="780,110 780,137.0"/>
<polyline class="w" points="780,143.0 780,170"/>
<polyline class="w" points="770,137.0 790,137.0"/>
<polyline class="w" points="770,143.0 790,143.0"/>
<text x="780" y="197" text-anchor="middle" class="ref " font-size="11">C21</text>
<text x="780" y="209" text-anchor="middle" class="val" font-size="11">10 µF</text>
<polyline class="w" points="780,170 780,176"/>
<polyline class="w" points="771,176 789,176"/>
<polyline class="w" points="774,180 786,180"/>
<polyline class="w" points="777,184 783,184"/>
<polyline class="w" points="570,260 588,260"/>
<polyline class="w" points="589,255 599,265"/>
<polyline class="w" points="589,265 599,255"/>
<text x="564" y="264" text-anchor="end" font-size="11">INT2 (9)</text>
<text x="604" y="264" text-anchor="start" font-size="11">non raccordée</text>
<polyline class="w" points="570,290 588,290"/>
<text x="564" y="294" text-anchor="end" font-size="11">SDx (2), SCx (3)</text>
<text x="604" y="294" text-anchor="start" font-size="11">à la masse (jamais flottantes)</text>
<text x="564" y="312" text-anchor="end" font-size="11">OCS_Aux (10), SDO_Aux (11)</text>
<text x="604" y="312" text-anchor="start" font-size="11">non connectées (soudées, sans piste)</text>
<text x="564" y="330" text-anchor="end" font-size="11">GND (6, 7)</text>
<text x="604" y="330" text-anchor="start" font-size="11">à la masse</text>
<polyline class="w" points="475,340 475,360"/>
<polyline class="w" points="475,360 475,366"/>
<polyline class="w" points="466,366 484,366"/>
<polyline class="w" points="469,370 481,370"/>
<polyline class="w" points="472,374 478,374"/>
<text x="485" y="356" text-anchor="start" font-size="11">GND</text>
<text x="485" y="372" text-anchor="start" font-size="11">pas de plan de masse coupé sous le composant</text>
<text x="20" y="395" text-anchor="start" class="ref" font-size="11">Registres écrits à l'initialisation (confirmés dans la fiche DS12140 Rev 3, p. 47 à 52) :</text>
<text x="20" y="411" text-anchor="start" font-size="11">CTRL3_C = 0x44 (BDU et IF_INC, après SW_RESET et attente de fin de reset) ; CTRL4_C = 0x06 (liaison I2C coupée, filtre passe-bas du gyroscope actif)</text>
<text x="20" y="425" text-anchor="start" font-size="11">CTRL1_XL = 0x9C (3,33 kHz, ±8 g) ; CTRL2_G = 0x9C (3,33 kHz, ±2000 °/s) ; INT1_CTRL = 0x03 (données prêtes accéléromètre et gyroscope)</text>
<text x="20" y="439" text-anchor="start" font-size="11">identité WHO_AM_I (0x0F) attendue : 0x6C ; échelles : gyroscope 70 m°/s par pas, accéléromètre 0,244 mg par pas</text>
<text x="20" y="453" text-anchor="start" font-size="11">Mise en route : IMU_BOOT_WAIT_MS = 40 ms (au moins 35 ms, fiche p. 11) avant le premier accès SPI.</text>
<text x="20" y="471" text-anchor="start" class="twarn" font-size="11">Axes : rotation de 180° autour de x par défaut (puce face vers le bas), constante de config_fixed.h, à confirmer après le routage (DOU-167).</text>
<text x="20" y="487" text-anchor="start" class="twarn" font-size="11">Orange : orientation des axes (DOU-167) ; durée du reset logiciel et départ des 35 ms (DOU-196).</text>
<line x1="14" y1="530" x2="886" y2="530" class="thin" style="opacity:.4"/>
<text x="20" y="546" style="font-size:11px">Couleurs : rouge = VBATM / VBATL ; bleu = +3V0 ; violet = +2V0 ; vert = signaux ; noir = masse et liaisons ; orange = à vérifier.</text>
<text x="20" y="560" style="font-size:11px">Texte de référence : DES-003 « Raccordement de la centrale inertielle LSM6DSO ». Croisement de fils sans point = pas de liaison. Noms et numéros des broches de</text>
<text x="20" y="574" style="font-size:11px">   la fiche DS12140 Rev 3 (tableau 1 p. 8).</text>
<text x="20" y="588" style="font-size:11px">Repères (R24, C19 à C21) provisoires. À vérifier (orange) : DOU-167 « Orientation des axes de la centrale et sens de rotation des moteurs » ; DOU-196</text>
<text x="20" y="602" style="font-size:11px">   « LSM6DSO : durée du reset logiciel et départ du temps de mise en route non trouvés » ; DOU-183 « Repères de composants provisoires des schémas SVG de la</text>
<text x="20" y="616" style="font-size:11px">   conception détaillée ».</text>
<text x="20" y="630" style="font-size:11px">Illustration de conception, pas le schéma KiCad de fabrication (DEC-275 « Schémas SVG des circuits de la carte dans la conception détaillée »).</text>
</svg>