<text x="660" y="197" text-anchor="middle" class="ref " font-size="11">C19</text>
<text x="660" y="209" text-anchor="middle" class="val" font-size="11">100 nF</text>
<polyline class="w" points="660,170 660,176"/>
<polyline class="w" points="651,176 669,176"/>
<polyline class="w" points="654,180 666,180"/>
<polyline class="w" points="657,184 663,184"/>
