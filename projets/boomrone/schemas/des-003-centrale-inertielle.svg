<polyline class="w" points="570,434 600,434"/>
<polyline class="w" points="601,429 611,439"/>
<polyline class="w" points="601,439 611,429"/>
<text x="622" y="438" text-anchor="start" font-size="11">NC : non connectée (soudée, sans piste)</text>
<text x="20" y="494" text-anchor="start" font-size="11">Chaque broche du LGA-14 est dessinée : signal, alimentation, masse (symbole de masse) ou NC (croix).</text>
<text x="20" y="525" text-anchor="start" class="ref" font-size="11">Registres écrits à l'initialisation (confirmés dans la fiche DS12140 Rev 3, p. 47 à 52) :</text>
<text x="20" y="541" text-anchor="start" font-size="11">CTRL3_C = 0x44 (BDU et IF_INC, après SW_RESET et attente de fin de reset) ; CTRL4_C = 0x06 (liaison I2C coupée, filtre passe-bas du gyroscope actif)</text>
<text x="20" y="555" text-anchor="start" font-size="11">CTRL1_XL = 0x9C (3,33 kHz, ±8 g) ; CTRL2_G = 0x9C (3,33 kHz, ±2000 °/s) ; INT1_CTRL = 0x03 (données prêtes accéléromètre et gyroscope)</text>
<text x="20" y="569" text-anchor="start" font-size="11">identité WHO_AM_I (0x0F) attendue : 0x6C ; échelles : gyroscope 70 m°/s par pas, accéléromètre 0,244 mg par pas</text>
<text x="20" y="583" text-anchor="start" font-size="11">Mise en route : IMU_BOOT_WAIT_MS = 40 ms (au moins 35 ms, fiche p. 11) avant le premier accès SPI.</text>
<text x="20" y="601" text-anchor="start" class="twarn" font-size="11">Axes : rotation de 180° autour de x par défaut (puce face vers le bas), constante de config_fixed.h, à confirmer après le routage (DOU-167).</text>
<text x="20" y="617" text-anchor="start" class="twarn" font-size="11">Orange : orientation des axes (DOU-167) ; durée du reset logiciel et départ des 35 ms (DOU-196).</text>
<line x1="14" y1="660" x2="886" y2="660" class="thin" style="opacity:.4"/>
<text x="20" y="676" style="font-size:11px">Couleurs : rouge = VBATM / VBATL ; bleu = +3V0 ; violet = +2V0 ; vert = signaux ; noir = masse et liaisons ; croix = broche non connectée (NC) ; orange = à vérifier.</text>
<text x="20" y="690" style="font-size:11px">Texte de référence : DES-003 « Raccordement de la centrale inertielle LSM6DSO ». Croisement de fils sans point = pas de liaison. Noms et numéros des broches de</text>
<text x="20" y="704" style="font-size:11px">   la fiche DS12140 Rev 3 (tableau 1 p. 8).</text>
<text x="20" y="718" style="font-size:11px">Repères (R24, C19 à C21) provisoires. À vérifier (orange) : DOU-167 « Orientation des axes de la centrale et sens de rotation des moteurs » ; DOU-196</text>
<text x="20" y="732" style="font-size:11px">   « LSM6DSO : durée du reset logiciel et départ du temps de mise en route non trouvés » ; DOU-183 « Repères de composants provisoires des schémas SVG de la</text>
<text x="20" y="746" style="font-size:11px">   conception détaillée ».</text>
<text x="20" y="760" style="font-size:11px">Illustration de conception, pas le schéma KiCad de fabrication (DEC-275 « Schémas SVG des circuits de la carte dans la conception détaillée »).</text>
</svg>
