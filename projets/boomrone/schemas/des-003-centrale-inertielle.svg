<text x="314" y="139.0" text-anchor="start" class="ref " font-size="11">R24</text>
<text x="314" y="152.0" text-anchor="start" class="val" font-size="11">10 kΩ</text>
<polyline class="l3" points="300,110 300,94"/>
<polygon class="fl3" points="300,86 295,96 305,96"/>
<text x="300" y="80" text-anchor="middle" class="tl3" font-size="12">+3V0</text>
<text x="20" y="318" text-anchor="start" font-size="11">SPI1 (AF5), mode 3, diviseur 32 : 5,3125 MHz</text>
<text x="20" y="332" text-anchor="start" font-size="11">CS au repos haut : composant désélectionné pendant le reset</text>
<text x="564" y="174" text-anchor="end" font-size="11">VDD (8)</text>
<text x="564" y="204" text-anchor="end" font-size="11">VDDIO (5)</text>
