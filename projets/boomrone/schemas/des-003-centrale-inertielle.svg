.w{stroke:var(--fg);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.thin{stroke:var(--fg);stroke-width:1;fill:none}
.box{stroke:var(--fg);stroke-width:1.6;fill:var(--fg);fill-opacity:.06}
.dash{stroke:var(--fg);stroke-width:1.2;fill:none;stroke-dasharray:5 4}
.bat{stroke:#ef4444;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.l3{stroke:#3b82f6;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.l2{stroke:#a855f7;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.warn{stroke:#d97706;stroke-width:1.8;fill:none;stroke-dasharray:6 3}
.sig{stroke:#059669;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.fill{fill:var(--fg);stroke:none}
.fbat{fill:#ef4444;stroke:none}.fl3{fill:#3b82f6;stroke:none}.fl2{fill:#a855f7;stroke:none}.fsig{fill:#059669;stroke:none}
.tbat{fill:#ef4444;font-weight:bold}.tl3{fill:#3b82f6;font-weight:bold}.tl2{fill:#a855f7;font-weight:bold}
.tsig{fill:#059669}.twarn{fill:#d97706;font-weight:bold}
.ref{font-weight:bold}.small{font-size:11px}.title{font-size:16px;font-weight:bold}
.val{opacity:.9}
</style>
