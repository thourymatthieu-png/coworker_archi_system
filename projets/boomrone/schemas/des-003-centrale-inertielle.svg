<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 646" width="900" height="646" role="img" aria-labelledby="t d"><title id="t">DES-003 — Raccordement de la centrale inertielle LSM6DSO</title><desc id="d">LSM6DSOTR en SPI 4 fils sur SPI1, CS avec rappel de 10 kohms, INT1 vers PB0, VDD et VDDIO au +3V0 avec 100 nF et 10 microfarads.</desc><style>
:root{--fg:#1f2937}
.bg{fill:#ffffff}
@media (prefers-color-scheme: dark){:root{--fg:#e5e7eb}.bg{fill:#1e1e1e}}
