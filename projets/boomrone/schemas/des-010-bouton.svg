<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 524" width="900" height="524" role="img" aria-labelledby="t d"><title id="t">DES-010 — Circuit du bouton</title><desc id="d">Poussoir TS-1088-AR02016 entre un noeud et la masse, 1 kohm en série vers PB5, rappel de 10 kohms au +3V0 et 10 nF à la masse.</desc><style>
:root{--fg:#1f2937}
.bg{fill:#ffffff}
@media (prefers-color-scheme: dark){:root{--fg:#e5e7eb}.bg{fill:#1e1e1e}}
text{fill:var(--fg);font-family:Segoe UI,Arial,sans-serif;font-size:12px}
.w{stroke:var(--fg);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.thin{stroke:var(--fg);stroke-width:1;fill:none}
.box{stroke:var(--fg);stroke-width:1.6;fill:var(--fg);fill-opacity:.06}
.dash{stroke:var(--fg);stroke-width:1.2;fill:none;stroke-dasharray:5 4}
.bat{stroke:#ef4444;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.l3{stroke:#3b82f6;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.l2{stroke:#a855f7;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.warn{stroke:#d97706;stroke-width:1.8;fill:none;stroke-dasharray:6 3}
.sig{stroke:#059669;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.fill{fill:var(--fg);stroke:none}
.fbat{fill:#ef4444;stroke:none}.fl3{fill:#3b82f6;stroke:none}.fl2{fill:#a855f7;stroke:none}.fsig{fill:#059669;stroke:none}
.tbat{fill:#ef4444;font-weight:bold}.tl3{fill:#3b82f6;font-weight:bold}.tl2{fill:#a855f7;font-weight:bold}
.tsig{fill:#059669}.twarn{fill:#d97706;font-weight:bold}
.ref{font-weight:bold}.small{font-size:11px}.title{font-size:16px;font-weight:bold}
.val{opacity:.9}
</style>
<rect class="bg" id="fond" x="0" y="0" width="900" height="524"/>
<text x="20" y="26" style="font-size:16px;font-weight:bold">DES-010 — Circuit du bouton</text>
<polyline class="w" points="150,200 230,200"/>
<circle cx="150" cy="200" r="3.2" class="fill"/>
<polyline class="w" points="150,200 150,235"/>
<circle cx="150" cy="240" r="3" class="w"/>
<circle cx="150" cy="290" r="3" class="w"/>
<polyline class="w" points="138,238 166,252"/>
<polyline class="w" points="150,293 150,305"/>
<polyline class="w" points="150,305 150,311"/>
<polyline class="w" points="141,311 159,311"/>
<polyline class="w" points="144,315 156,315"/>
<polyline class="w" points="147,319 153,319"/>
<text x="100" y="262" text-anchor="end" class="ref" font-size="11">SW1</text>
<text x="100" y="276" text-anchor="end" font-size="11">TS-1088-AR02016</text>
<text x="158" y="220" text-anchor="start" font-size="11">nœud du poussoir</text>
<polyline class="w" points="150,200 227.0,200"/>
<polyline class="w" points="253.0,200 330,200"/>
<rect x="227.0" y="195" width="26" height="10" rx="1" class="w"/>
<text x="240.0" y="190" text-anchor="middle" font-size="11">R29 1 kΩ</text>
<polyline class="sig" points="330,200 500,200"/>
<circle cx="400" cy="200" r="3.2" class="fsig"/>
<text x="425" y="192" text-anchor="start" class="tsig" font-size="12">BTN</text>
<polyline class="w" points="400,105 400,139.5"/>
<polyline class="w" points="400,165.5 400,200"/>
<rect x="395" y="139.5" width="10" height="26" rx="1" class="w"/>
<text x="414" y="151.5" text-anchor="start" class="ref " font-size="11">R30</text>
<text x="414" y="164.5" text-anchor="start" class="val" font-size="11">10 kΩ</text>
<polyline class="l3" points="400,105 400,89"/>
<polygon class="fl3" points="400,81 395,91 405,91"/>
<text x="400" y="75" text-anchor="middle" class="tl3" font-size="12">+3V0</text>
<polyline class="w" points="400,200 400,242.0"/>
<polyline class="w" points="400,248.0 400,290"/>
<polyline class="w" points="390,242.0 410,242.0"/>
<polyline class="w" points="390,248.0 410,248.0"/>
<text x="414" y="244.0" text-anchor="start" class="ref " font-size="11">C26</text>
<text x="414" y="257.0" text-anchor="start" class="val" font-size="11">10 nF</text>
<polyline class="w" points="400,290 400,296"/>
<polyline class="w" points="391,296 409,296"/>
<polyline class="w" points="394,300 406,300"/>
<polyline class="w" points="397,304 403,304"/>
<rect x="500" y="160" width="110" height="90" rx="4" class="box"/>
<text x="555.0" y="176" text-anchor="middle" class="ref" font-size="13">U1</text>
<text x="555.0" y="190" text-anchor="middle" font-size="11">STM32G431</text>
<polyline class="w" points="500,200 500,200"/>
<text x="505" y="204" text-anchor="start" font-size="11">PB5</text>
<text x="578" y="238" text-anchor="middle" font-size="11">entrée</text>
<text x="20" y="350" text-anchor="start" class="ref" font-size="11">Constantes de temps (texte de DES-010) :</text>
<text x="20" y="365" text-anchor="start" font-size="11">appui : τ = 1 kΩ × 10 nF = 10 µs (le condensateur se décharge dans le contact)</text>
<text x="20" y="380" text-anchor="start" font-size="11">relâchement : τ = (10 kΩ + 1 kΩ) × 10 nF = 110 µs</text>
<text x="20" y="395" text-anchor="start" font-size="11">très inférieures à l'antirebond logiciel de 10 ms (DES-028)</text>
<text x="20" y="410" text-anchor="start" font-size="11">courant dans le contact : 0,27 mA</text>
<text x="20" y="425" text-anchor="start" font-size="11">niveau stable avant la fin du reset grâce au rappel externe (entrée en mode réglage)</text>
<text x="20" y="440" text-anchor="start" font-size="11">Placé sur la face haute, accessible sans retirer d'anneau.</text>
<line x1="14" y1="450" x2="886" y2="450" class="thin" style="opacity:.4"/>
<text x="20" y="466" style="font-size:11px">Couleurs : rouge = VBATM / VBATL ; bleu = +3V0 ; violet = +2V0 ; vert = signaux ; noir = masse et liaisons ; orange = à vérifier.</text>
<text x="20" y="480" style="font-size:11px">Texte de référence : DES-010 « Circuit du bouton ». Repères (SW1, R29, R30, C26) provisoires.</text>
<text x="20" y="494" style="font-size:11px">À vérifier (orange) : DOU-183 « Repères de composants provisoires des schémas SVG de la conception détaillée ».</text>
<text x="20" y="508" style="font-size:11px">Illustration de conception, pas le schéma KiCad de fabrication (DEC-275 « Schémas SVG des circuits de la carte dans la conception détaillée »).</text>
</svg>