<polyline class="w" points="745,250 745,287.0"/>
<polyline class="w" points="745,293.0 745,330"/>
<polyline class="w" points="735,287.0 755,287.0"/>
<polyline class="w" points="735,293.0 755,293.0"/>
<text x="759" y="289.0" text-anchor="start" class="ref " font-size="11">C12</text>
<text x="759" y="302.0" text-anchor="start" class="val" font-size="11">100 nF</text>
<polyline class="w" points="745,330 745,336"/>
<polyline class="w" points="736,336 754,336"/>
<polyline class="w" points="739,340 751,340"/>
<polyline class="w" points="742,344 748,344"/>
<circle cx="745" cy="250" r="3.2" class="fsig"/>
<rect x="780" y="190" width="100" height="100" rx="4" class="box"/>
<text x="830.0" y="206" text-anchor="middle" class="ref" font-size="13">U1</text>
<text x="830.0" y="220" text-anchor="middle" font-size="11">STM32G431</text>
<polyline class="w" points="780,250 780,250"/>
<text x="785" y="254" text-anchor="start" font-size="11">PA0</text>
<text x="742" y="240" text-anchor="end" class="tsig" font-size="11">VBAT_SENSE</text>
<text x="820" y="270" text-anchor="middle" font-size="11">ADC1 IN1</text>
<text x="560" y="385" text-anchor="start" font-size="11">Rapport 0,6 : 4,2 V donne 2,52 V ; courant 16,8 µA</text>
<text x="560" y="399" text-anchor="start" font-size="11">impédance de source 60 kΩ</text>
<text x="560" y="413" text-anchor="start" font-size="11">pas 3,0 V / 4095 = 0,73 mV sur la broche,</text>
<text x="560" y="427" text-anchor="start" font-size="11">soit 1,22 mV sur la batterie</text>
<text x="560" y="441" text-anchor="start" font-size="11">erreur du pont à 0,1 % : ≈ 3 mV à 3,7 V</text>
<text x="560" y="455" text-anchor="start" font-size="11">constante VBAT_GAIN_TRIM (étalonnage facultatif)</text>
<text x="560" y="372" text-anchor="start" font-size="11">Séquence et formule : DES-022</text>
<text x="30" y="410" text-anchor="start" class="twarn" font-size="11">Orange : valeurs des condensateurs et numéros de broches de mémoire.</text>
<line x1="14" y1="520" x2="886" y2="520" class="thin" style="opacity:.4"/>
<text x="20" y="536" style="font-size:11px">Couleurs : rouge = VBATM / VBATL ; bleu = +3V0 ; violet = +2V0 ; vert = signaux ; noir = masse et liaisons ; orange = à vérifier.</text>
<text x="20" y="550" style="font-size:11px">Texte de référence : DES-009 « Régulateur de 3,0 V et pont de mesure de la tension ». Le pont lit VBATM (avant la ferrite), pas VBATL.</text>
<text x="20" y="564" style="font-size:11px">Repères (U5, C10, C11, R20, R21, C12) provisoires. À vérifier (orange) : DOU-173 « Composants passifs et découplages à relever dans les fiches avant</text>
<text x="20" y="578" style="font-size:11px">   le routage » ; DOU-182 « Noms et numéros de broches des circuits intégrés des schémas SVG non relevés dans les fiches » ; DOU-183 « Repères de</text>
<text x="20" y="592" style="font-size:11px">   composants provisoires des schémas SVG de la conception détaillée ».</text>
<text x="20" y="606" style="font-size:11px">Illustration de conception, pas le schéma KiCad de fabrication (DEC-275 « Schémas SVG des circuits de la carte dans la conception détaillée »).</text>
</svg>