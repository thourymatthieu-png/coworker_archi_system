<polyline class="w" points="350,270 350,276"/>
<polyline class="w" points="341,276 359,276"/>
<polyline class="w" points="344,280 356,280"/>
<polyline class="w" points="347,284 353,284"/>
<polyline class="l3" points="590,200 590,184"/>
<polygon class="fl3" points="590,176 585,186 595,186"/>
<text x="590" y="170" text-anchor="middle" class="tl3" font-size="12">+3V0</text>
<text x="400" y="190" text-anchor="start" font-size="11">vers U6 (DES-005), MCU, capteurs,</text>
<text x="400" y="218" text-anchor="start" font-size="11">module radio : 130 mA</text>
<text x="176" y="140" text-anchor="start" class="twarn" font-size="11">n° 1, 2, 3 de mémoire (SOT-23)</text>
<text x="30" y="330" text-anchor="start" font-size="11">Dimensionnement : 130 mA ; à 4,2 V : 1,2 V × 0,13 A = 0,16 W</text>
<text x="30" y="344" text-anchor="start" font-size="11">échauffement 37 K avec 230 K/W (SOT-23 sans cuivre) ; petit polygone de cuivre</text>
<text x="30" y="358" text-anchor="start" font-size="11">sortie réglée tant que la batterie dépasse 3,1 V</text>
<text x="30" y="372" text-anchor="start" font-size="11">composant : 1 µF au minimum en céramique (valeurs à confirmer)</text>
<polyline class="bat" points="700,110 700,94"/>
<polygon class="fbat" points="700,86 695,96 705,96"/>
