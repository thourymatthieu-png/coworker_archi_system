<text x="686" y="302.0" text-anchor="end" class="val" font-size="11">150 kΩ 0,1 %</text>
<polyline class="w" points="700,330 700,336"/>
<polyline class="w" points="691,336 709,336"/>
<polyline class="w" points="694,340 706,340"/>
<polyline class="w" points="697,344 703,344"/>
