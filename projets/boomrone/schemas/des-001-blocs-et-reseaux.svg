<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 702" width="900" height="702" role="img" aria-labelledby="t d"><title id="t">DES-001 — Schéma par blocs, réseaux et domaines de tension de la carte</title><desc id="d">Du connecteur XT30 aux blocs de la carte : VBATM vers les moteurs, le voyant, le buzzer et le pont de mesure ; VBATL par la ferrite vers le régulateur 3,0 V, qui alimente le microcontrôleur, les capteurs, le module radio et le régulateur 2,0 V du flux optique.</desc><style>
:root{--fg:#1f2937}
.bg{fill:#ffffff}
@media (prefers-color-scheme: dark){:root{--fg:#e5e7eb}.bg{fill:#1e1e1e}}
text{fill:var(--fg);font-family:Segoe UI,Arial,sans-serif;font-size:12px}
.w{stroke:var(--fg);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.thin{stroke:var(--fg);stroke-width:1;fill:none}
.box{stroke:var(--fg);stroke-width:1.6;fill:var(--fg);fill-opacity:.06}
.dash{stroke:var(--fg);stroke-width:1.2;fill:none;stroke-dasharray:5 4}
.bat{stroke:#ef4444;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.l3{stroke:#3b82f6;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.l2{stroke:#a855f7;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.warn{stroke:#d97706;stroke-width:1.8;fill:none;stroke-dasharray:6 3}
.sig{stroke:#059669;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.fill{fill:var(--fg);stroke:none}
.fbat{fill:#ef4444;stroke:none}.fl3{fill:#3b82f6;stroke:none}.fl2{fill:#a855f7;stroke:none}.fsig{fill:#059669;stroke:none}
.tbat{fill:#ef4444;font-weight:bold}.tl3{fill:#3b82f6;font-weight:bold}.tl2{fill:#a855f7;font-weight:bold}
.tsig{fill:#059669}.twarn{fill:#d97706;font-weight:bold}
.ref{font-weight:bold}.small{font-size:11px}.title{font-size:16px;font-weight:bold}
.val{opacity:.9}
</style>
<rect class="bg" id="fond" x="0" y="0" width="900" height="702"/>
<text x="20" y="26" style="font-size:16px;font-weight:bold">DES-001 — Schéma par blocs, réseaux et domaines de tension de la carte</text>
<rect x="10" y="140" width="80" height="70" rx="4" class="box"/>
<text x="50.0" y="156" text-anchor="middle" class="ref" font-size="13">J1</text>
<text x="50.0" y="170" text-anchor="middle" font-size="11">XT30</text>
<text x="50" y="226" text-anchor="middle" font-size="11">batterie</text>
<polyline class="bat" points="90,170 120,170"/>
<circle cx="120" cy="170" r="3.2" class="fbat"/>
<polyline class="bat" points="120,170 120,80"/>
<polyline class="bat" points="120,80 860,80"/>
<polyline class="bat" points="120,80 120,64"/>
<polygon class="fbat" points="120,56 115,66 125,66"/>
<text x="112" y="50" text-anchor="start" class="tbat" font-size="12">VBATM (3,1 à 4,2 V ; 9,5 A en crête)</text>
<circle cx="265.0" cy="80" r="3.2" class="fbat"/>
<polyline class="bat" points="265.0,80 265.0,100"/>
<rect x="170" y="100" width="190" height="52" rx="4" class="box"/>
<text x="265.0" y="116" text-anchor="middle" class="ref" font-size="11">DES-007</text>
<text x="265.0" y="130" text-anchor="middle" font-size="11">4 MOSFET Q1 à Q4 + 4 moteurs</text>
<text x="265.0" y="144" text-anchor="middle" font-size="10">M1_G à M4_G (PA8 à PA11)</text>
<circle cx="460.0" cy="80" r="3.2" class="fbat"/>
<polyline class="bat" points="460.0,80 460.0,100"/>
<rect x="375" y="100" width="170" height="52" rx="4" class="box"/>
<text x="460.0" y="116" text-anchor="middle" class="ref" font-size="11">DES-011</text>
<text x="460.0" y="130" text-anchor="middle" font-size="11">voyant RGB + buzzer</text>
<text x="460.0" y="144" text-anchor="middle" font-size="10">(3 + 1 MOSFET) : LED_R/G/B, BUZ</text>
<circle cx="640.0" cy="80" r="3.2" class="fbat"/>
<polyline class="bat" points="640.0,80 640.0,100"/>
<rect x="560" y="100" width="160" height="52" rx="4" class="box"/>
<text x="640.0" y="116" text-anchor="middle" class="ref" font-size="11">DES-009</text>
<text x="640.0" y="130" text-anchor="middle" font-size="11">pont 100 kΩ / 150 kΩ</text>
<text x="640.0" y="144" text-anchor="middle" font-size="10">vers PA0 (VBAT_SENSE)</text>
<polyline class="bat" points="120,170 120,200 140,200"/>
<rect x="140" y="188" width="80" height="24" rx="4" class="box"/>
<text x="180" y="204" text-anchor="middle" class="ref" font-size="11">FB1 120 Ω</text>
<polyline class="bat" points="220,200 250,200"/>
<text x="190" y="228" text-anchor="middle" class="tbat" font-size="11">VBATL</text>
<rect x="250" y="180" width="110" height="40" rx="4" class="box"/>
<text x="305.0" y="196" text-anchor="middle" class="ref" font-size="13">U5</text>
<text x="305" y="212" text-anchor="middle" font-size="11">MCP1700 3,0 V</text>
<polyline class="l3" points="360,200 880,200"/>
<text x="375" y="194" text-anchor="start" class="tl3" font-size="12">+3V0 (130 mA)</text>
<circle cx="420.0" cy="200" r="3.2" class="fl3"/>
<polyline class="l3" points="420.0,200 420.0,245"/>
<rect x="370" y="245" width="100" height="50" rx="4" class="box"/>
<text x="420.0" y="261" text-anchor="middle" class="ref" font-size="11">U1 STM32G431</text>
<text x="420.0" y="277" text-anchor="middle" font-size="11">DES-002</text>
<circle cx="525.0" cy="200" r="3.2" class="fl3"/>
<polyline class="l3" points="525.0,200 525.0,245"/>
<rect x="480" y="245" width="90" height="50" rx="4" class="box"/>
<text x="525.0" y="261" text-anchor="middle" class="ref" font-size="11">U2 LSM6DSO</text>
<text x="525.0" y="277" text-anchor="middle" font-size="11">DES-003</text>
<circle cx="625.0" cy="200" r="3.2" class="fl3"/>
<polyline class="l3" points="625.0,200 625.0,245"/>
<rect x="580" y="245" width="90" height="50" rx="4" class="box"/>
<text x="625.0" y="261" text-anchor="middle" class="ref" font-size="11">U3 VL53L1X</text>
<text x="625.0" y="277" text-anchor="middle" font-size="11">DES-004</text>
<circle cx="725.0" cy="200" r="3.2" class="fl3"/>
<polyline class="l3" points="725.0,200 725.0,245"/>
<rect x="680" y="245" width="90" height="50" rx="4" class="box"/>
<text x="725.0" y="261" text-anchor="middle" class="ref" font-size="11">U7 E104-BT02</text>
<text x="725.0" y="277" text-anchor="middle" font-size="11">DES-012</text>
<circle cx="830.0" cy="200" r="3.2" class="fl3"/>
<polyline class="l3" points="830.0,200 830.0,245"/>
<rect x="780" y="245" width="100" height="50" rx="4" class="box"/>
<text x="830.0" y="261" text-anchor="middle" class="ref" font-size="11">U6 XC6206</text>
<text x="830.0" y="277" text-anchor="middle" font-size="11">DES-005</text>
<polyline class="l2" points="830,295 830,360"/>
<text x="822" y="318" text-anchor="end" class="tl2" font-size="11">+2V0 (≈ 9 mA)</text>
<rect x="780" y="360" width="100" height="50" rx="4" class="box"/>
<text x="830" y="376" text-anchor="middle" class="ref" font-size="11">U4 PMW3901MB</text>
<text x="830" y="392" text-anchor="middle" font-size="11">DES-005</text>
<polyline class="sig" points="420,295 420,330 725,330"/>
<polyline class="sig" points="525,330 525,295"/>
<circle cx="525" cy="330" r="3.2" class="fsig"/>
<polyline class="sig" points="625,330 625,295"/>
<circle cx="625" cy="330" r="3.2" class="fsig"/>
<polyline class="sig" points="725,330 725,295"/>
<circle cx="725" cy="330" r="3.2" class="fsig"/>
<polyline class="sig" points="725,330 750,330 750,385 780,385"/>
<text x="430" y="346" text-anchor="start" class="tsig" font-size="11">signaux : SPI1, I2C1, USART2, interruptions, XSHUT</text>
<text x="430" y="360" text-anchor="start" class="tsig" font-size="11">SPI2 vers U4 (FLX_SCK, FLX_MISO, FLX_MOSI, FLX_CS)</text>
<text x="20" y="250" text-anchor="start" class="ref" font-size="11">Masse unique</text>
<text x="20" y="264" text-anchor="start" font-size="11">(plan plein)</text>
<polyline class="w" points="60,275 60,281"/>
<polyline class="w" points="51,281 69,281"/>
<polyline class="w" points="54,285 66,285"/>
<polyline class="w" points="57,289 63,289"/>
<text x="20" y="440" text-anchor="start" font-size="11">Réseaux de signaux (nom, broche) : M1_G à M4_G (PA8 à PA11) ; IMU_SCK, IMU_MISO, IMU_MOSI (PA5, PA6, PA7), IMU_CS (PA4), IMU_INT1 (PB0) ; FLX_SCK,</text>
<text x="20" y="454" text-anchor="start" font-size="11">  FLX_MISO, FLX_MOSI (PB13, PB14, PB15), FLX_CS (PB12) ; I2C_SCL (PA15), I2C_SDA (PB7), TOF_GPIO1 (PB6), TOF_XSHUT (PB9) ; BLE_TX (PA2), BLE_RX (PA3)</text>
<text x="20" y="468" text-anchor="start" font-size="11">  ; BLE_WKP (PA1) ; LED_R, LED_G, LED_B (PB1, PB2, PB10), BUZ (PB11) ; BTN (PB5) ; VBAT_SENSE (PA0) ; SWDIO (PA13), SWCLK (PA14), NRST, BOOT0 (PB8).</text>
<text x="20" y="488" text-anchor="start" font-size="11">Points d'essai (pastilles de 1 mm, face haute) : +3V0, +2V0, VBATM, VBATL, GND (deux), M1_D (drain du moteur 1), BLE_TX, BLE_RX, TOF_GPIO1.</text>
<text x="20" y="508" text-anchor="start" font-size="11">Règle de lecture : un réseau absent de la liste ne doit pas exister au schéma ; un réseau de la liste a au moins deux broches (TU-001). Budgets : +3V0</text>
<text x="20" y="522" text-anchor="start" font-size="11">  130 mA ; VBATM 9,5 A en crête de 2 s.</text>
<line x1="14" y1="600" x2="886" y2="600" class="thin" style="opacity:.4"/>
<text x="20" y="616" style="font-size:11px">Couleurs : rouge = VBATM / VBATL ; bleu = +3V0 ; violet = +2V0 ; vert = signaux ; noir = masse et liaisons ; orange = à vérifier.</text>
<text x="20" y="630" style="font-size:11px">Texte de référence : DES-001 « Schéma par blocs, réseaux et domaines de tension de la carte ». Vue par blocs : le détail de chaque bloc est dans le</text>
<text x="20" y="644" style="font-size:11px">   schéma du DES indiqué dans la boîte.</text>
<text x="20" y="658" style="font-size:11px">Repères (J1, FB1, U1 à U7) provisoires : le texte du DES n'en donne pas (DOU-183 « Repères de composants provisoires des schémas SVG de la conception</text>
<text x="20" y="672" style="font-size:11px">   détaillée »).</text>
<text x="20" y="686" style="font-size:11px">Illustration de conception, pas le schéma KiCad de fabrication (DEC-275 « Schémas SVG des circuits de la carte dans la conception détaillée »).</text>
</svg>